name: Daily bank import

on:
  schedule:
    - cron: '7 11 * * *' # every day ~7am US Eastern (11:07 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bank-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch new transactions (encrypted for the phones)
        env:
          SIMPLEFIN_SETUP_TOKEN: ${{ secrets.SIMPLEFIN_SETUP_TOKEN }}
        run: node importer/import.mjs
      - name: Save to the repo
        run: |
          git config user.name "household-ledger-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A inbox config 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Daily bank import"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
